spring.application.name=AegisAgent-Backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/aegisagent_db
spring.datasource.username=postgres
spring.datasource.password=Postgres25

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-4bh7j5ar6pum37rm.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://aegisagent-api

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB